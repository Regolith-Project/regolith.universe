name: bump-repo-versions-build-depends

on:
  # schedule trigger removed: needs secrets.APP_ID/PRIVATE_KEY (Autoware's
  # GitHub App) to open PRs against autowarefoundation/autoware_universe,
  # which this fork doesn't have and doesn't need - out of scope, see
  # regolith-build.yaml. Left as workflow_dispatch in case it's ever wanted.
  workflow_dispatch:

jobs:
  create-version-update-pr:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: Create PRs to update VCS repositories for autoware.repos
        uses: autowarefoundation/autoware-github-actions/create-prs-to-update-vcs-repositories@v1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repo_name: autowarefoundation/autoware_universe
          parent_dir: .
          targets: major minor patch
          base_branch: main
          new_branch_prefix: feat/update-
          autoware_repos_file_name: build_depends_stable.repos
          verbosity: 0
